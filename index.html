<!doctype html>
<html lang="en">
  <head>

    <meta property="og:title" content="ALLEGRO — Africa’s Music Platform for the World" />

    <meta property="og:url" content="https://allegro-vibez.vercel.app/" />
    <meta property="og:image" content="https://allegro-vibez.vercel.app/av-hero.webp" />
    <meta property="og:image:alt" content="ALLEGRO VIBEZ — African music from roots to the global digital stage" />

    <title>ALLEGRO — Africa’s Music Platform for the World</title>

  <body>
    <form name="allegro-revenue-desk" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="allegro-revenue-desk" />
      <input name="bot-field" />
      <input name="package" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <textarea name="campaign"></textarea>
      <input name="consent" />
    </form>
    <form name="allegro-artist-interest" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="allegro-artist-interest" />
      <input name="bot-field" />
      <input name="artist_name" />
      <input name="contact_name" />
      <input name="email" />
      <input name="phone" />
      <input name="creator_type" />
      <input name="country" />
      <input name="home_region" />
      <input name="genres" />
      <input name="languages" />
      <input name="international_bookings" />
      <textarea name="goal"></textarea>
      <input name="consent" />
    </form>

    <form name="allegro-artist-booking" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="allegro-artist-booking" />
      <input name="bot-field" />
      <input name="artist_id" />
      <input name="artist_name" />
      <input name="company_name" />
      <input name="contact_name" />
      <input name="contact_email" />
      <input name="contact_phone" />
      <input name="preferred_contact" />
      <input name="performance_type" />
      <input name="performance_other" />
      <input name="event_date" />
      <input name="event_time" />
      <input name="event_visibility" />
      <input name="venue_name" />
      <input name="venue_address" />
      <input name="city" />
      <input name="country" />
      <textarea name="event_description"></textarea>
      <input name="expected_audience" />
      <input name="proposed_budget" />
      <input name="budget_currency" />
      <input name="backline_provided" />
      <input name="flights_hotel_provided" />
      <input name="ground_transport_provided" />
      <input name="visa_support_required" />
      <input name="livestream_rights_requested" />
      <input name="recording_rights_requested" />
      <input name="merchandise_opportunity" />
      <textarea name="special_requests"></textarea>
      <input name="privacy_consent" />
    </form>
    <div id="root"></div>
    <noscript>ALLEGRO VIBEZ requires JavaScript to run the creator platform.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
