<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publishing Review — Creator OS</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#070707;color:#f5f2ea;font:15px Arial,sans-serif}.wrap{width:min(900px,92%);margin:auto}.top{padding:20px 0;border-bottom:1px solid #292929}.brand{font-weight:900;letter-spacing:.08em}.gold{color:#d8b45a}.hero{padding:55px 0 25px}.eyebrow{color:#d8b45a;font-size:11px;font-weight:800;letter-spacing:.18em}.hero h1{font:48px Georgia,serif;margin:14px 0}.panel{border:1px solid #292929;background:#111;padding:24px;margin:18px 0}.field{display:flex;flex-direction:column;gap:8px;margin:12px 0}label{color:#aaa59b;font-size:11px;text-transform:uppercase;letter-spacing:.1em}input,button{padding:12px;border-radius:6px}input{background:#090909;border:1px solid #292929;color:#f5f2ea}button{background:#d8b45a;border:1px solid #d8b45a;font-weight:800;cursor:pointer}.muted{color:#aaa59b}.ok{color:#6fd39a}.err{color:#e67d7d}.hidden{display:none}.result{margin-top:15px;line-height:1.7}.back{color:#aaa59b}</style></head><body><header class="top"><div class="wrap"><span class="brand">ALLEGRO <span class="gold">VIBEZ</span></span> · CREATOR OS</div></header><main class="wrap"><section class="hero"><div class="eyebrow">PUBLISHING REVIEW</div><h1>Ready means ready.</h1><p class="muted">This workspace submits a completed release for publishing review. It does not represent distribution, DSP delivery, or royalty payment.</p></section><section id="auth" class="panel"><h2>Creator access</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button id="signin">Sign in</button><div id="authStatus" class="result"></div></section><section id="app" class="panel hidden"><div class="field"><label>Release ID</label><input id="release" placeholder="Paste release ID"></div><button id="check">Check readiness</button><button id="submit" class="hidden">Request Publishing Review</button><div id="result" class="result"></div><p><a class="back" href="/creator-os/">← Back to Creator OS</a></p></section></main><script>const URL='https://yfawrenhudjomhnglfhq.supabase.co',KEY='sb_publishable_3KY--8Y_uuKEdfdumC2txg__OWTRo2p',db=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let ready=false;function out(t,c=''){const e=$('result');e.textContent=t;e.className='result '+c}async function init(){const {data:{user}}=await db.auth.getUser();$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user)}$('signin').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('authStatus').textContent=error.message;$('authStatus').className='result err';return}await init()};$('check').onclick=async()=>{const id=$('release').value.trim();if(!id){out('Release ID is required.','err');return}const {data,error}=await db.rpc('creator_release_review_ready',{p_release_id:id});if(error){out(error.message,'err');return}ready=!!data;$('submit').classList.toggle('hidden',!ready);out(ready?'Release is complete and eligible for publishing review.':'Release is not ready. Complete the required catalogue, rights and audio requirements first.',ready?'ok':'err')};$('submit').onclick=async()=>{if(!ready)return;const id=$('release').value.trim();const {data,error}=await db.rpc('creator_request_release_review',{p_release_id:id});if(error){out(error.message,'err');return}out('Publishing review requested. Release status: '+data.status+'. Distribution has not been claimed.','ok');$('submit').classList.add('hidden')};db.auth.onAuthStateChange(()=>init());init();</script></body></html>
