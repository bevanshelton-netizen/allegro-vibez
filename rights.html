<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rights — ALLEGRO-VIBEZ</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><a class="brand" href="index.html"><span>ALLEGRO</span><b>VIBEZ</b></a><nav><a href="studio.html">Studio</a><a href="rights.html">Rights</a><a href="earnings.html">Earnings</a></nav></header><main class="page"><p class="eyebrow">RIGHTS & CREDITS</p><h1>Make ownership visible.</h1><p class="lead">Use this planning tool to check contributor splits before a production rights service is connected.</p><div class="form"><label>Writer / Artist %<input id="a" type="number" min="0" max="100" value="50"></label><label>Producer %<input id="b" type="number" min="0" max="100" value="25"></label><label>Other contributor %<input id="c" type="number" min="0" max="100" value="25"></label><div class="metric"><small>TOTAL</small><strong id="total">100%</strong></div></div><p id="msg" class="notice">Ready — the split totals 100%.</p></main><script>function calc(){let n=['a','b','c'].reduce((s,id)=>s+(+document.getElementById(id).value||0),0);document.getElementById('total').textContent=n+'%';const m=document.getElementById('msg');m.textContent=n===100?'Ready — the split totals 100%.':'Adjust contributors until the total equals 100%.'}document.querySelectorAll('input').forEach(x=>x.oninput=calc)</script></body></html>
