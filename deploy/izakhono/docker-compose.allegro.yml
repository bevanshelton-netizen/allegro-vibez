services:
  allegro-vibez:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - allegro_internal
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      ALLEGRO_DOMAIN: ${ALLEGRO_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      allegro-vibez:
        condition: service_healthy
    networks:
      - allegro_internal
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:

networks:
  allegro_internal:
    driver: bridge
