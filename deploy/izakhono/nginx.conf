server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        try_files /healthz =404;
    }

    location = /creator-studio {
        return 301 /creator-studio/;
    }

    location ^~ /creator-studio/ {
        rewrite ^/creator-studio/(.*)$ /creator-os/$1 last;
    }

    # Slug URLs use the shared profile template; the browser pathname is
    # preserved so the page can resolve the requested artist slug safely.
    location ~ ^/artists/[^/.]+/?$ {
        rewrite ^ /artists/profile.html last;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
