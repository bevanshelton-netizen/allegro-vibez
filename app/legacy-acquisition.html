<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALLEGRO-VIBEZ | Legacy Acquisition</title><style>body{margin:0;background:#07140f;color:#f5f1df;font-family:Inter,Arial,sans-serif}header{padding:28px 6%;border-bottom:1px solid #29452f}h1{margin:0;color:#d8b45a}main{padding:28px 6%;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#0d2118;border:1px solid #31523a;border-radius:14px;padding:20px}.label{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#91ad96}.value{font-size:32px;font-weight:700;margin-top:8px}.pipeline{display:flex;gap:8px;overflow:auto;margin:24px 0}.stage{min-width:125px;padding:14px;background:#10291d;border-radius:10px;text-align:center}.stage b{display:block;color:#d8b45a;margin-bottom:6px}.section{margin-top:30px}.muted{color:#aab9ad}.notice{padding:16px;border-left:4px solid #d8b45a;background:#10291d}.login{max-width:420px;margin:12vh auto}.input{width:100%;box-sizing:border-box;margin:7px 0;padding:13px;border-radius:8px;border:1px solid #385c42;background:#081710;color:white}button{padding:12px 18px;border:0;border-radius:8px;background:#d8b45a;color:#07140f;font-weight:700;cursor:pointer}</style></head><body><header><h1>ALLEGRO-VIBEZ</h1><div class="muted">LEGACY ARTIST ACQUISITION & RELAUNCH PIPELINE</div></header><main id="app"><div class="login"><h2>Command Access</h2><input id="email" class="input" placeholder="Email"><input id="password" type="password" class="input" placeholder="Password"><button onclick="login()">Sign in</button><p id="msg" class="muted"></p></div></main><script>const SUPABASE_URL='https://yfawrenhudjomhnglfhq.supabase.co',PUB='sb_publishable_3KY--8Y_uuKEdfdumC2txg__OWTRo2p';let token=null;async function login(){const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:PUB,'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok){msg.textContent=d.msg||d.error_description||'Sign-in failed';return}token=d.access_token;load()}async function api(path){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:{apikey:PUB,Authorization:'Bearer '+token}});return r.ok?r.json():[]}async function load(){const leads=await api('allegro_legacy_acquisition_leads?select=*&order=priority.desc,created_at.desc');const counts={};leads.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);app.innerHTML='<h2>Legacy Artist Acquisition</h2><p class="muted">Find established artists. Qualify the career. Build the second career.</p><div class="grid">'+[['Discovered','discovered'],['Researched','researched'],['Qualified','qualified'],['Invited','invited'],['Engaged','engaged'],['Assessment','assessment'],['Accepted','accepted']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${counts[x[1]]||0}</div></div>`).join('')+'</div><div class="pipeline">'+['DISCOVERED','RESEARCHED','QUALIFIED','INVITED','ENGAGED','ASSESSMENT','ACCEPTED'].map((x,i)=>`<div class="stage"><b>${i+1}</b>${x}</div>`).join('')+'</div><div class="section notice"><b>Rights-safe acquisition</b><br><span class="muted">No automatic rights assignment. No assumed catalogue ownership. Every artist enters through evidence, consent and explicit agreements.</span></div><div class="section"><h3>Acquisition Queue</h3><div id="rows"></div></div>';rows.innerHTML=leads.length?leads.map(x=>`<div class="card" style="margin:10px 0"><b>${x.stage_name||x.artist_name||'Unnamed Artist'}</b><div class="muted">${x.country||'Territory not recorded'} · ${x.status||'discovered'} · Priority ${x.priority||'—'}</div><p>${x.notes||'No assessment notes yet.'}</p></div>`).join(''):'<div class="card muted">No acquisition leads recorded yet.</div>'}</script></body></html>
