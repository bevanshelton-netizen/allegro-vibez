<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALLEGRO-VIBEZ — Legacy Due Diligence</title><style>body{font-family:system-ui;margin:0;background:#07130f;color:#f4f0df}main{max-width:1100px;margin:auto;padding:32px}section{background:#10241b;border:1px solid #365b45;border-radius:16px;padding:20px;margin:16px 0}button,select,input{padding:11px;border-radius:9px;border:1px solid #50745c;background:#0b1913;color:#fff}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.score{font-size:30px;font-weight:700}.muted{color:#a9b9ad}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}</style></head><body><main><h1>Legacy Artist Due Diligence</h1><p class="muted">Evidence-led assessment before an artist is advanced into commercial revival. No rights, revenue or partnerships are assumed.</p><section><div class="row"><label>Lead <select id="lead"></select></label><button onclick="createReview()">Start / Open Assessment</button><button onclick="calculate()">Calculate Recommendation</button></div><p id="msg" class="muted"></p></section><section><h2>Assessment Scorecard</h2><div class="grid" id="scores"></div><p id="recommendation"></p></section><section><h2>Due-Diligence Checks</h2><div id="checks"></div></section></main><script type="module">
const URL='https://yfawrenhudjomhnglfhq.supabase.co'; const PUB='sb_publishable_3KY--8Y_uuKEdfdumC2txg__OWTRo2p'; let token=localStorage.getItem('sb_access_token'),review=null;
const h=()=>({apikey:PUB,Authorization:`Bearer ${token}`,'Content-Type':'application/json'});
async function api(path,opt={}){let r=await fetch(URL+'/rest/v1/'+path,{...opt,headers:{...h(),...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function rpc(name,body){let r=await fetch(URL+'/rest/v1/rpc/'+name,{method:'POST',headers:h(),body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.json()}
async function init(){if(!token){msg.textContent='Sign in through the main Command Centre first.';return}let leads=await api('allegro_legacy_acquisition_leads?select=id,artist_name,stage_name,status&status=in.(qualified,invited,engaged,assessment)&order=priority.asc,created_at.desc');lead.innerHTML=leads.map(x=>`<option value="${x.id}">${x.stage_name||x.artist_name} — ${x.status}</option>`).join('');}
window.createReview=async()=>{try{review=await rpc('allegro_create_legacy_due_diligence_review',{p_lead_id:lead.value});await load();msg.textContent='Assessment workspace opened. Mark evidence-backed checks only.'}catch(e){msg.textContent=e.message}}
async function load(){if(!review)return;let r=(await api(`allegro_legacy_due_diligence_reviews?id=eq.${review}&select=*`))[0];let checks=await api(`allegro_legacy_due_diligence_checks?review_id=eq.${review}&select=*&order=category,check_key`);scores.innerHTML=[['Catalogue',r.catalogue_score],['Career',r.career_significance_score],['Rights',r.rights_readiness_score],['Commercial',r.commercial_potential_score],['Brand',r.brand_strength_score],['Market',r.market_opportunity_score],['Overall',r.overall_score]].map(([a,b])=>`<div><div class="muted">${a}</div><div class="score">${b??'—'}</div></div>`).join('');recommendation.textContent=r.recommendation?`Recommendation: ${r.recommendation.replaceAll('_',' ')}`:'Recommendation pending evidence.';document.getElementById('checks').innerHTML=checks.map(c=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #294436"><b>${c.check_key.replaceAll('_',' ')}</b><select onchange="updateCheck('${c.id}',this.value)">${['pending','verified','evidence_needed','failed','not_applicable'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select><span class="muted">${c.category}</span></div>`).join('')}
window.updateCheck=async(id,status)=>{try{await api(`allegro_legacy_due_diligence_checks?id=eq.${id}`,{method:'PATCH',body:JSON.stringify({status,checked_at:new Date().toISOString(),updated_at:new Date().toISOString()})});await load()}catch(e){msg.textContent=e.message}}
window.calculate=async()=>{if(!review){msg.textContent='Open an assessment first.';return}try{await rpc('allegro_calculate_legacy_due_diligence',{p_review_id:review});await load();msg.textContent='Recommendation calculated from recorded evidence.'}catch(e){msg.textContent=e.message}};
init();</script></body></html>
