name: Build ALLEGRO-VIBEZ

on:
  push:
    branches: [main, agent/launch-v7]
  pull_request:
    branches: [main]

jobs:
  launch-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify IZAKHONO runtime, lint and build
        run: npm run verify:all
        env:
          VITE_IZAKHONO_CORE_URL: https://api.izakhono.africa
          VITE_IZAKHONO_PROJECT: allegro_vibez
          VITE_IZAKHONO_PUBLIC_KEY: ik_pub_ci_placeholder
      - name: Record production cutover gate
        run: |
          echo "Code gate passed."
          echo "Live promotion remains blocked until IZAKHONO Core/CLOUD is running on the production server and the end-to-end health gate passes."
