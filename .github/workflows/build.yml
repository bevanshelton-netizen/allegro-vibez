name: Build ALLEGRO-VIBEZ

on:
  push:
    branches: [main, agent/launch-v7]
  pull_request:
    branches: [main]

jobs:
  launch-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify IZAKHONO preference, failover, lint and build
        run: npm run verify:all
      - name: Preserve deployable website
        uses: actions/upload-artifact@v4
        with:
          name: allegro-site-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
