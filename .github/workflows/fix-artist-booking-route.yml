name: Repair artist booking route

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[booking-route-repair]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch App.jsx
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()

          import_line = "import { ArtistBookingRequest } from './pages/ArtistBooking.jsx'\n"
          if import_line not in s:
              marker = "import { supabase } from './lib/supabaseClient'\n"
              if marker not in s:
                  raise SystemExit('Could not locate App.jsx import marker')
              s = s.replace(marker, marker + import_line, 1)

          route_marker = "  else if (location.pathname.startsWith('/bookings')) content = <Bookings />\n"
          route_line = "  else if (/^\\/artist\\/[^/]+\\/book$/.test(location.pathname)) content = <ArtistBookingRequest /> // /artist/:artistId/book\n"
          if "/artist/:artistId/book" not in s:
              if route_marker not in s:
                  raise SystemExit('Could not locate App.jsx bookings route marker')
              s = s.replace(route_marker, route_line + route_marker, 1)
          elif "ArtistBookingRequest" not in s:
              raise SystemExit('Artist booking route marker exists but component import is missing')

          p.write_text(s)
          PY

      - name: Verify patch
        run: |
          grep -F "import { ArtistBookingRequest } from './pages/ArtistBooking.jsx'" src/App.jsx
          grep -F "/artist/:artistId/book" src/App.jsx
          grep -F "ArtistBookingRequest" src/App.jsx

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ALLEGRO Repair Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx .github/workflows/fix-artist-booking-route.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: restore artist booking route [booking-route-repair]'
          git push
