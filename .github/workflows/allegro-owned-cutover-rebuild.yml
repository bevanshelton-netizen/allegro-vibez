name: ALLEGRO Owned Cutover — Production Master

on:
  push:
    branches: [rebuild/production-master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'Dockerfile'
      - 'deploy/**'
      - 'scripts/izakhono/production-cutover.sh'
      - '.github/workflows/allegro-owned-cutover-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allegro-owned-cutover-production-master
  cancel-in-progress: true

jobs:
  cutover:
    name: Build, canary, promote and verify on IZAKHONO
    runs-on: [self-hosted, linux, x64, izakhono]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Deploy through owner-controlled IZAKHONO host
        env:
          VITE_IZAKHONO_CORE_URL: ${{ secrets.IZAKHONO_CORE_URL }}
          VITE_IZAKHONO_PUBLIC_KEY: ${{ secrets.ALLEGRO_IZAKHONO_PUBLIC_KEY }}
          IZAKHONO_PUBLIC_APP_URL: ${{ vars.ALLEGRO_PUBLIC_URL }}
        run: sh scripts/izakhono/production-cutover.sh
