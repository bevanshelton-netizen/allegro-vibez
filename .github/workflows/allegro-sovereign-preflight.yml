name: ALLEGRO Sovereign Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.izakhono.json'
      - 'scripts/izakhono/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/allegro-sovereign-preflight.yml'

jobs:
  preflight:
    name: Validate sovereign release package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ALLEGRO
        uses: actions/checkout@v4

      - name: Verify required production files
        run: |
          set -eu
          for file in Dockerfile scripts/izakhono/production-cutover.sh scripts/izakhono/node01-release-poller.sh scripts/izakhono/allegro-owned-runtime-probe.sh scripts/izakhono/node01-release-poller.sh scripts/izakhono/install-node01-release-poller.sh deploy/izakhono/node01-allegro-release-poller.service infra/izakhono/runtime-binding.NODE01.json deploy/izakhono/docker-compose.allegro.yml deploy/izakhono/Caddyfile; do
            test -f "$file" || { echo "Missing required production file: $file"; exit 1; }
          done
          grep -q '"identity_type": "software-runtime"' infra/izakhono/runtime-binding.NODE01.json
          grep -q '"ownership": "izakhono-owned"' infra/izakhono/runtime-binding.NODE01.json
          grep -q '"live": false' infra/izakhono/runtime-binding.NODE01.json

      - name: Verify owned-first release contract
        run: |
          set -eu
          grep -q 'NODE01' .github/workflows/izakhono-owned-production.yml
          grep -q 'izakhono.runtime-binding/v1' .github/workflows/izakhono-owned-production.yml
          grep -q 'NOT_YET_PUBLIC' .github/workflows/izakhono-owned-production.yml

      - name: Validate cutover and runtime-probe shell syntax
        run: |
          sh -n scripts/izakhono/production-cutover.sh
          sh -n scripts/izakhono/allegro-owned-runtime-probe.sh\n          sh -n scripts/izakhono/node01-release-poller.sh\n          sh -n scripts/izakhono/install-node01-release-poller.sh\n          systemd-analyze verify deploy/izakhono/node01-allegro-release-poller.service

      - name: Build production image as package validation
        run: docker build --tag allegro-vibez:preflight-${GITHUB_SHA::12} .

      - name: Smoke-test packaged platform routes
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name allegro-preflight -p 127.0.0.1:18080:8080 "allegro-vibez:preflight-${GITHUB_SHA::12}"
          cleanup() { docker rm -f allegro-preflight >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18080/ | grep -q 'id="platform"'
          for route in /app/artist-os/ /creator-studio/ /app/catalogue/ /app/rights/ /app/money.html /app/bookings/ /app/opportunities/ /app/profile/ /live/ /studios/ /radio/ /management/ /collaborate/; do
            echo "Checking $route"
            curl -fsS "http://127.0.0.1:18080$route" >/dev/null
          done

      - name: Report deployment boundary
        run: |
          echo 'ALLEGRO sovereign preflight passed.'
          echo 'Production execution remains restricted to IZAKHONO NODE01.'
          echo 'This workflow does not publish or claim public live status.'
