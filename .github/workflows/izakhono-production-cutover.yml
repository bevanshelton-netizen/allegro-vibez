name: IZAKHONO Production Cutover

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.izakhono.json'
      - 'deploy/**'
      - 'scripts/izakhono/**'
      - '.github/workflows/izakhono-production-cutover.yml'

permissions:
  contents: read

concurrency:
  group: allegro-vibez-izakhono-production
  cancel-in-progress: true

jobs:
  cutover:
    name: Canary, promote and verify on owned node
    runs-on: [self-hosted, linux, x64, izakhono]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Deploy through owner-controlled IZAKHONO node fabric
        env:
          VITE_IZAKHONO_CORE_URL: ${{ secrets.IZAKHONO_CORE_URL }}
          VITE_IZAKHONO_PUBLIC_KEY: ${{ secrets.ALLEGRO_IZAKHONO_PUBLIC_KEY }}
          IZAKHONO_PUBLIC_APP_URL: ${{ vars.ALLEGRO_PUBLIC_URL }}
          IZAKHONO_NODE_ID: ${{ runner.name }}
          IZAKHONO_RECEIPT_DIR: ${{ github.workspace }}/artifacts/izakhono
        run: sh scripts/izakhono/production-cutover.sh
      - name: Publish deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allegro-izakhono-deployment-receipt-${{ github.run_id }}
          path: artifacts/izakhono/*.json
          if-no-files-found: warn
          retention-days: 30
