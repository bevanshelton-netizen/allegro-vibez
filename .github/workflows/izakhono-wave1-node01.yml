name: IZAKHONO Wave 1 NODE01 Local Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/IZAKHONO_WAVE1_NODE01'

permissions:
  contents: read

concurrency:
  group: izakhono-wave1-node01-local-proof
  cancel-in-progress: true

jobs:
  local-proof:
    name: NODE01 immutable Wave 1 proof
    runs-on: [self-hosted, linux, x64, izakhono]
    timeout-minutes: 60
    steps:
      - name: Checkout trigger contract
        uses: actions/checkout@v4

      - name: Verify installed Wave 1 bundle matches trigger
        shell: bash
        run: |
          set -euo pipefail
          contract="$GITHUB_WORKSPACE/deploy/IZAKHONO_WAVE1_NODE01"
          test -r "$contract"

          expected_builder="$(sed -n 's/^BUILDER_REF=//p' "$contract" | head -n1)"
          expected_allegro="$(sed -n 's/^ALLEGRO_REF=//p' "$contract" | head -n1)"
          expected_chancellor="$(sed -n 's/^CHANCELLOR_REF=//p' "$contract" | head -n1)"

          [[ "$expected_builder" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_allegro" =~ ^[0-9a-f]{40}$ ]]
          [[ "$expected_chancellor" =~ ^[0-9a-f]{40}$ ]]

          workdir="$RUNNER_TEMP/izakhono-builder-contract"
          rm -rf "$workdir"
          git init -q "$workdir"
          git -C "$workdir" remote add origin https://github.com/bevanshelton-netizen/izakhono-builder.git
          git -C "$workdir" fetch -q --depth=1 origin "$expected_builder"
          git -C "$workdir" checkout -q --detach FETCH_HEAD

          expected_bundle="$(bash "$workdir/scripts/launch-stack/compute-wave1-bundle-id.sh" "$workdir")"
          [[ "$expected_bundle" =~ ^[0-9a-f]{64}$ ]]
          test -r /opt/izakhono/wave1/BUNDLE_SHA256
          actual_bundle="$(tr -d '\r\n' < /opt/izakhono/wave1/BUNDLE_SHA256)"
          if [ "$actual_bundle" != "$expected_bundle" ]; then
            echo "[SAFE STOP] Installed NODE01 Wave 1 bundle digest is stale."
            echo "Expected bundle: $expected_bundle"
            echo "Installed bundle: $actual_bundle"
            exit 78
          fi

          python3 - "$expected_allegro" "$expected_chancellor" <<'PY'
          import json
          import pathlib
          import sys

          expected_allegro, expected_chancellor = sys.argv[1:]
          root = pathlib.Path("/opt/izakhono/wave1/products/izakhono-node/profiles/wave1")
          checks = {
              "allegro-vibez.production.json": expected_allegro,
              "the-chancellor.production.json": expected_chancellor,
          }
          for filename, expected in checks.items():
              path = root / filename
              if not path.is_file():
                  raise SystemExit(f"[SAFE STOP] Missing installed profile: {path}")
              actual = json.loads(path.read_text(encoding="utf-8")).get("ref")
              if actual != expected:
                  raise SystemExit(
                      f"[SAFE STOP] Stale installed profile {filename}: expected {expected}, got {actual}"
                  )
          print("[PASS] Installed Wave 1 bundle exactly matches the trigger contract.")
          PY

      - name: Verify NODE01 local services
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:9191/readyz
          curl --fail --silent --show-error http://127.0.0.1:9292/healthz
          test -x /opt/izakhono/bin/run-wave1-local-proof
          sudo -n -l /opt/izakhono/bin/run-wave1-local-proof >/dev/null

      - name: Run fixed least-privilege Wave 1 local deployment
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /opt/izakhono/bin/run-wave1-local-proof
          test -r /opt/izakhono/evidence/IZAKHONO-NODE01-WAVE1-REPORT.json
          cp /opt/izakhono/evidence/IZAKHONO-NODE01-WAVE1-REPORT.json \
            "$GITHUB_WORKSPACE/IZAKHONO-NODE01-WAVE1-REPORT.json"
          if [ -r /opt/izakhono/evidence/IZAKHONO-NODE01-WAVE1-REPORT.json.sha256 ]; then
            cp /opt/izakhono/evidence/IZAKHONO-NODE01-WAVE1-REPORT.json.sha256 \
              "$GITHUB_WORKSPACE/IZAKHONO-NODE01-WAVE1-REPORT.json.sha256"
          fi

      - name: Verify proof report matches trigger contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/deploy/IZAKHONO_WAVE1_NODE01" "$GITHUB_WORKSPACE/IZAKHONO-NODE01-WAVE1-REPORT.json" <<'PY'
          import json
          import pathlib
          import sys

          contract_path, report_path = map(pathlib.Path, sys.argv[1:])
          contract = {}
          for raw in contract_path.read_text(encoding="utf-8").splitlines():
              if "=" in raw:
                  key, value = raw.split("=", 1)
                  contract[key.strip()] = value.strip()

          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("overall") != "PASS_LOCAL_OWNED":
              raise SystemExit(f"[SAFE STOP] Local proof did not pass: {report.get('overall')}")

          installed_builder = report.get("builder_bundle_ref")
          if not (
              isinstance(installed_builder, str)
              and len(installed_builder) == 40
              and all(ch in "0123456789abcdef" for ch in installed_builder)
          ):
              raise SystemExit("[SAFE STOP] Proof report Builder provenance is not attested.")

          expected_bundle_path = pathlib.Path("/opt/izakhono/wave1/BUNDLE_SHA256")
          if not expected_bundle_path.is_file():
              raise SystemExit("[SAFE STOP] Installed Wave 1 bundle digest is missing.")
          expected_bundle = expected_bundle_path.read_text(encoding="utf-8").strip()
          if report.get("wave1_bundle_sha256") != expected_bundle:
              raise SystemExit("[SAFE STOP] Proof report Wave 1 digest does not match installed bundle.")

          refs = {entry.get("slug"): entry.get("immutable_ref") for entry in report.get("apps", [])}
          expected = {
              "allegro-vibez": contract.get("ALLEGRO_REF"),
              "the-chancellor": contract.get("CHANCELLOR_REF"),
          }
          if refs != expected:
              raise SystemExit(f"[SAFE STOP] Proof report app refs differ from trigger: {refs!r}")

          print("[PASS] NODE01 proof report matches the exact requested Builder and app refs.")
          PY

      - name: Preserve NODE01 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IZAKHONO-NODE01-WAVE1-REPORT
          path: |
            IZAKHONO-NODE01-WAVE1-REPORT.json
            IZAKHONO-NODE01-WAVE1-REPORT.json.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Probe owned public routes without changing DNS
        if: success()
        shell: bash
        run: |
          set -u
          for host in allegro.izakhonoafrica.co.za chancellor.izakhonoafrica.co.za; do
            echo "=== $host ==="
            getent ahostsv4 "$host" || true
          done
          curl -fsS --max-time 15 https://allegro.izakhonoafrica.co.za/healthz || true
          curl -fsS --max-time 15 https://chancellor.izakhonoafrica.co.za/api/health || true
