name: IZAKHONO Wave 1 NODE01 Local Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/IZAKHONO_WAVE1_NODE01'

permissions:
  contents: read

concurrency:
  group: izakhono-wave1-node01-local-proof
  cancel-in-progress: false

jobs:
  local-proof:
    name: NODE01 immutable Wave 1 proof
    runs-on: [self-hosted, linux, x64, izakhono]
    timeout-minutes: 60
    steps:
      - name: Verify NODE01 local services
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:9191/readyz
          curl --fail --silent --show-error http://127.0.0.1:9292/healthz
          test -x /opt/izakhono/bin/run-wave1-local-proof
          sudo -n -l /opt/izakhono/bin/run-wave1-local-proof >/dev/null

      - name: Run fixed least-privilege Wave 1 local deployment
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /opt/izakhono/bin/run-wave1-local-proof
          test -r /opt/izakhono/evidence/IZAKHONO-NODE01-WAVE1-REPORT.json
          cp /opt/izakhono/evidence/IZAKHONO-NODE01-WAVE1-REPORT.json \
            "$GITHUB_WORKSPACE/IZAKHONO-NODE01-WAVE1-REPORT.json"
          if [ -r /opt/izakhono/evidence/IZAKHONO-NODE01-WAVE1-REPORT.json.sha256 ]; then
            cp /opt/izakhono/evidence/IZAKHONO-NODE01-WAVE1-REPORT.json.sha256 \
              "$GITHUB_WORKSPACE/IZAKHONO-NODE01-WAVE1-REPORT.json.sha256"
          fi

      - name: Preserve NODE01 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IZAKHONO-NODE01-WAVE1-REPORT
          path: |
            IZAKHONO-NODE01-WAVE1-REPORT.json
            IZAKHONO-NODE01-WAVE1-REPORT.json.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Probe owned public routes without changing DNS
        if: success()
        shell: bash
        run: |
          set -u
          for host in allegro.izakhonoafrica.co.za chancellor.izakhonoafrica.co.za; do
            echo "=== $host ==="
            getent ahostsv4 "$host" || true
          done
          curl -fsS --max-time 15 https://allegro.izakhonoafrica.co.za/healthz || true
          curl -fsS --max-time 15 https://chancellor.izakhonoafrica.co.za/api/health || true
