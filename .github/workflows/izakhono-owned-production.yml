name: ALLEGRO — IZAKHONO Release Publisher

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'Dockerfile'
      - 'healthz'
      - 'robots.txt'
      - 'sitemap.xml'
      - '404.html'
      - 'site.webmanifest'
      - 'deploy/izakhono/**'
      - 'scripts/izakhono/**'
      - '.github/workflows/izakhono-owned-production.yml'
      - '.izakhono.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: allegro-owned-release-publisher
  cancel-in-progress: false

env:
  ALLEGRO_PUBLIC_URL: https://allegrovibez.com
  NODE_ID: NODE01
  RUNTIME_BINDING_SCHEMA: izakhono.runtime-binding/v1
  RELEASE_AUTHORITY: /opt/izakhono/bin/izakhono-release

jobs:
  publish-contract:
    name: Publish NODE01 release contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate sovereign production contract
        shell: bash
        run: |
          set -euo pipefail
          test -f .izakhono.json
          test -f scripts/izakhono/production-cutover.sh
          test -f scripts/izakhono/node01-release-poller.sh
          test -f infra/izakhono/runtime-binding.NODE01.json
          test -f scripts/izakhono/allegro-owned-runtime-probe.sh
          grep -q 'software-runtime' infra/izakhono/runtime-binding.NODE01.json
          grep -q 'izakhono-owned' infra/izakhono/runtime-binding.NODE01.json
          grep -q 'izakhono.runtime-binding/v1' infra/izakhono/runtime-binding.NODE01.json
          grep -q 'NOT_YET_PUBLIC' infra/izakhono/runtime-binding.NODE01.json
          echo 'Sovereign release contract: PASS'

      - name: Publish immutable NODE01 release contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-contracts/allegro-vibez
          cat > release-contracts/allegro-vibez/${GITHUB_SHA}.json <<EOF
          {
            "schema": "izakhono.node01/release/v2",
            "state": "READY",
            "application": "allegro-vibez",
            "revision": "${GITHUB_SHA}",
            "branch": "main",
            "logical_node_id": "NODE01",
            "identity_type": "software-runtime",
            "runtime_binding_schema": "${RUNTIME_BINDING_SCHEMA}",
            "runtime_host_is_separate": true,
            "runtime_class": "oci-docker",
            "ownership": "izakhono-owned",
            "edge_network": "izakhono-edge",
            "release_authority": "${RELEASE_AUTHORITY}",
            "artifact_identity": "immutable-image-digest",
            "source_repository": "bevanshelton-netizen/allegro-vibez",
            "source_commit": "${GITHUB_SHA}",
            "public_url": "${ALLEGRO_PUBLIC_URL}",
            "executor": "NODE01",
            "production_claim": "NOT_YET_PUBLIC",
            "required_gates": ["source-integrity","build","application-health","canary","public-https","dns-tls","backup-restore","rollback","post-rollback-health"]
          }
          EOF
          cp release-contracts/allegro-vibez/${GITHUB_SHA}.json release-contracts/allegro-vibez/CURRENT.json

      - name: Commit release contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'IZAKHONO Release Publisher'
          git config user.email 'izakhono-release@users.noreply.github.com'
          git add release-contracts/allegro-vibez
          if git diff --cached --quiet; then
            echo 'No release-contract changes to publish.'
            exit 0
          fi
          git commit -m "chore(release): publish ALLEGRO NODE01 contract ${GITHUB_SHA}"
          git push origin HEAD:main

      - name: Release handoff status
        run: |
          echo 'ALLEGRO release contract published for NODE01.'
          echo 'GitHub Actions is the publisher only.'
          echo 'NODE01 executes through /opt/izakhono/bin/izakhono-release.'
          echo 'LIVE status remains unclaimed until runtime acceptance evidence exists.'
