name: Allegro Owned Web Release

on:
  push:
    branches: [rebuild/production-master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/bevanshelton-netizen/allegro-vibez-web

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish owned web runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            IZAKHONO_RELEASE_ID=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:production-master
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Emit release handoff
        run: |
          echo "Owned Allegro web image: $IMAGE:${GITHUB_SHA}"
          echo "Runtime class: owned"
          echo "Release commit: ${GITHUB_SHA}"
