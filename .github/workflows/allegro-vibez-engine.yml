name: ALLEGRO-VIBEZ Engine

on:
  push:
    paths:
      - "engines/allegro-vibez/**"
      - ".github/workflows/allegro-vibez-engine.yml"
  pull_request:
    paths:
      - "engines/allegro-vibez/**"
      - ".github/workflows/allegro-vibez-engine.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/allegro-vibez
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile engine
        run: python -m py_compile engine.py test_engine.py
      - name: Run engine tests
        run: python -m unittest -v
