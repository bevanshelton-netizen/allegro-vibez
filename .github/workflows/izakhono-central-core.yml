name: IZAKHONO Central Alpha Core

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.izakhono.json'
      - 'Dockerfile'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/izakhono-central-core.yml'
  push:
    branches: [main]
    paths:
      - '.izakhono.json'
      - 'Dockerfile'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/izakhono-central-core.yml'

permissions:
  contents: read

jobs:
  alpha-core:
    # Pin the reviewed Builder policy so ALLEGRO cannot change gates merely because
    # the central repository moves. Upgrade this SHA only after Builder canaries pass.
    uses: bevanshelton-netizen/izakhono-builder/.github/workflows/izakhono-build-to-alpha.yml@b0698fccd942c132b22a3e4caa95044eef2da921
    with:
      manifest_path: .izakhono.json
