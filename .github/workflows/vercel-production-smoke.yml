name: Verify ALLEGRO Vercel Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vercel-production-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public ALLEGRO routes
        shell: bash
        run: |
          set -euo pipefail
          origin="https://allegro-vibez.vercel.app"
          for path in / /stream /radio /artists /join-artists; do
            code="$(curl --fail-with-body --silent --show-error --location --output /tmp/allegro-route.html --write-out '%{http_code}' "$origin$path")"
            test "$code" = "200"
            grep -Fq 'id="root"' /tmp/allegro-route.html
            echo "[PASS] $path -> HTTP $code"
          done
          curl --fail --silent --show-error --location "$origin/" | grep -Fq 'IZAKHONO global music streaming'
          echo '[PASS] Production brand marker is current.'
