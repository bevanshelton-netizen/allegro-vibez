name: ALLEGRO Radio Owner Node CI

on:
  pull_request:
    paths:
      - 'radio/owner-node/**'
      - 'scripts/test-radio-owner-node.py'
      - '.github/workflows/radio-owner-node-ci.yml'
  push:
    branches: [main]
    paths:
      - 'radio/owner-node/**'
      - 'scripts/test-radio-owner-node.py'
      - '.github/workflows/radio-owner-node-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile radio/owner-node/autopilot.py scripts/test-radio-owner-node.py
      - name: Rights-gated autopilot test
        run: python3 scripts/test-radio-owner-node.py
