name: Allegro Vibez — IZAKHONO Owned Runtime

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Public Linux runtime host'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: owned-production
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.IZAKHONO_RUNTIME_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Build on the owned runtime
        env:
          HOST: ${{ inputs.host }}
          USER: ${{ secrets.IZAKHONO_RUNTIME_SSH_USER }}
        run: |
          tar --exclude=.git -czf /tmp/allegro-vibez.tgz .
          scp -o StrictHostKeyChecking=no /tmp/allegro-vibez.tgz "$USER@$HOST:/tmp/allegro-vibez.tgz"
          ssh -o StrictHostKeyChecking=no "$USER@$HOST" 'set -eu; sudo mkdir -p /opt/izakhono/apps/allegro-vibez; sudo tar -xzf /tmp/allegro-vibez.tgz -C /opt/izakhono/apps/allegro-vibez; cd /opt/izakhono/apps/allegro-vibez; sudo docker build --pull -t izakhono/allegro-vibez:owned .; sudo docker rm -f allegro-vibez 2>/dev/null || true; sudo docker run -d --name allegro-vibez --restart unless-stopped --network host izakhono/allegro-vibez:owned'

      - name: External health gate
        env:
          HOST: ${{ inputs.host }}
        run: |
          curl --fail --retry 10 --retry-delay 3 "http://$HOST/healthz.json"
