name: IZAKHONO Build to Alpha

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  alpha:
    # Owner-controlled, immutable IZAKHONO policy. Promotion remains health-gated.
    uses: bevanshelton-netizen/izakhono-builder/.github/workflows/izakhono-build-to-alpha.yml@b0698fccd942c132b22a3e4caa95044eef2da921
    with:
      manifest_path: .izakhono.json
