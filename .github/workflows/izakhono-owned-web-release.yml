name: IZAKHONO Owned Allegro Web Release

on:
  push:
    branches: [main, rebuild/production-master]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "Dockerfile"
      - "deploy/nginx.conf"
      - "scripts/**"
      - ".github/workflows/izakhono-owned-web-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: allegro-owned-web-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build owned Allegro web image
        run: |
          set -euo pipefail
          docker build \
            --build-arg IZAKHONO_RELEASE_ID="${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "izakhono.product=allegro-vibez" \
            -t ghcr.io/bevanshelton-netizen/allegro-vibez-web:production-master \
            -t ghcr.io/bevanshelton-netizen/allegro-vibez-web:${GITHUB_SHA} \
            .

      - name: Smoke test image
        run: |
          set -euo pipefail
          docker run -d --name allegro-owned-web-smoke -p 127.0.0.1:18081:8080 ghcr.io/bevanshelton-netizen/allegro-vibez-web:${GITHUB_SHA}
          trap 'docker rm -f allegro-owned-web-smoke >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/healthz >/tmp/healthz.json; then break; fi
            sleep 2
          done
          grep -q '"ok":true' /tmp/healthz.json
          grep -q '"product":"allegro-vibez"' /tmp/healthz.json
          curl -fsS http://127.0.0.1:18081/ | grep -qi 'ALLEGRO'
          curl -fsS http://127.0.0.1:18081/radio | grep -q 'id="root"'

      - name: Publish immutable and production tags
        run: |
          docker push ghcr.io/bevanshelton-netizen/allegro-vibez-web:${GITHUB_SHA}
          docker push ghcr.io/bevanshelton-netizen/allegro-vibez-web:production-master
