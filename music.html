ntent=String(i+1).padStart(2,'0');const info=document.createElement('div');const h=document.createElement('h3');h.textContent=t[0];const p=document.createElement('p');p.textContent=t[1]+' · '+t[2];info.append(h,p);const b=document.createElement('button');b.className='button ghost';b.dataset.action='favorite';b.dataset.id=t[0];b.textContent=Allegro.state.favorites.includes(t[0])?'♥ Saved':'♡ Save';r.append(av,info,b);el.append(r)})}document.querySelector('#search').oninput=render;document.querySelector('#genre').onchange=render;render();</script></body></html>
